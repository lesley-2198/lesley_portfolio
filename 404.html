<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Lesley Ngcobo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" href="/favicon.ico">
    
    <meta name="description" content="Page not found - Lesley Ngcobo Portfolio">
    <meta name="robots" content="noindex, nofollow">
    
      <link rel="stylesheet" href="404.css">
</head>

<body>
    <!-- NAV -->
  <nav class="nav">
    <a href="/" class="nav-logo">LN</a>
  </nav>

  <!-- 404 -->
  <section class="error-404">
    <div class="error-wrap">

      <h1 class="error-code">404</h1>

      <h2 class="error-title">
        This route <em>doesn’t exist.</em>
      </h2>

      <p class="error-desc">
        The page you're looking for isn’t here — it may have been moved,
        renamed, or never existed.
      </p>

      <div class="error-actions">
        <a href="/" class="btn-primary">Back Home</a>
        <a href="/#projects" class="btn-ghost">View Projects</a>
      </div>

      <p class="error-meta">
        STATUS: 404_NOT_FOUND
      </p>

    </div>
  </section>
</body>
</html>
